version: "3.8"

services:
  fastapi:
    build: .
    container_name: autodrive-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  streamlit:
    build: .
    container_name: autodrive-ui
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - API_URL=http://fastapi:8000
    depends_on:
      - fastapi
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0